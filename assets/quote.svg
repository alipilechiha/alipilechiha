<svg xmlns="http://www.w3.org/2000/svg" width="800" height="70" viewBox="0 0 800 70">
  <rect width="800" height="70" rx="6" fill="#161b22"/>
  <text x="400" y="30" text-anchor="middle" fill="#6AD3F7" font-family="Georgia, serif" font-size="13">"Artificial intelligence is the science of making machines do things</text>
  <text x="400" y="50" text-anchor="middle" fill="#6AD3F7" font-family="Georgia, serif" font-size="13">that would require intelligence if done by men." — Marvin Minsky</text>
